models:
  - name: job_postings
    description: "Model representing job postings data."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_id
        description: "Unique identifier for each job posting."
      - name: job_title
        description: "Title of the job posting."
        data_tests:
          - not_null
      - name: company_name
        description: "Name of the company offering the job."
      - name: job_location
        description: "Location where the job is based."
      - name: job_via
        description: "Source or platform through which the job was posted."
      - name: job_schedule_type
        description: "Type of job schedule (e.g., full-time, part-time)."
      - name: job_work_from_home
        description: "True when posting is flagged remote, false otherwise."
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: search_date
        description: "Date when the job posting was searched or retrieved."
        data_tests:
          - not_null
      - name: search_term
        description: "Role the scraper was searching for."
        data_tests:
          - not_null

  - name: jobs_per_month
    description: "Model representing the count of job postings per month."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: "Posting month, truncated from the search date."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('monthly_summary')
                field: month
      - name: role
        description: "Role for which job postings were found."
        data_tests:
          - not_null
      - name: postings
        description: "Count of job postings for the given month."
        data_tests:
          - not_null

  - name: top_locations
    description: "Model representing the count of job postings per location."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_location
        description: "Location where the job is based."
        data_tests:
          - not_null
          - unique
      - name: postings
        description: "Count of job postings for the given location."
        data_tests:
          - not_null

  - name: monthly_summary
    description: "Monthly summary of job postings; one row per month."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: "Posting month, truncated from the search date."
        data_tests:
          - not_null
          - unique
      - name: total_postings
        description: "Total count of job postings for the given month."
        data_tests:
          - not_null
      - name: remote_postings
        description: "Count of remote job postings for the given month."
        data_tests:
          - not_null
      - name: remote_pct
        description: "Percentage of remote job postings for the given month."
        data_tests:
          - not_null